# SLIM data-plane node config for the integration tests (CI and local runs).
# Same as csit's integrations/agntcy-a2a-slimrpc/ci/slim-server-config.yaml at slim 2.1.1.
# Insecure TLS is intentional: an ephemeral, loopback-only node started for the test run.
tracing:
  log_level: info
  display_thread_names: true
  display_thread_ids: true

runtime:
  n_cores: 0
  thread_name: "slim-data-plane"
  drain_timeout: 10s

services:
  slim/0:
    dataplane:
      servers:
        - endpoint: "0.0.0.0:46357"
          tls:
            insecure: true
      clients: []
