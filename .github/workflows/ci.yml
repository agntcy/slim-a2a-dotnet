name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)

      - name: Install protoc-gen-slimrpc-csharp
        run: cargo install agntcy-protoc-slimrpc-plugin --version 2.0.0 --locked

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: buf generate
        run: buf generate
        working-directory: src/SlimA2A.Protos

      - name: Verify generated code is up to date
        run: |
          git diff --exit-code -- src/SlimA2A.Protos/Generated \
            || { echo "::error::Generated code is stale. Run 'buf generate' in src/SlimA2A.Protos and commit the result."; exit 1; }

      - name: dotnet build and test
        run: |
          dotnet build SlimA2A.sln -c Release
          dotnet test --solution SlimA2A.sln -c Release --no-build

  integration:
    name: Integration tests (SLIM node)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The released node csit's A2A SLIMRPC interop matrix pins; the digest is the multi-arch index.
      SLIM_IMAGE: ghcr.io/agntcy/slim:2.1.1@sha256:4930858c9ca022e5efe42bd4baca075d328f0cbb04d00e8dba696c3f1b8c2dd3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Start SLIM node
        run: |
          docker run -d --name slim-node -p 127.0.0.1:46357:46357 \
            -v "$GITHUB_WORKSPACE/tests/SlimA2A.IntegrationTests/slim-node-config.yaml:/config.yaml:ro" \
            "$SLIM_IMAGE" /slim --config /config.yaml
          for _ in $(seq 1 30); do
            docker logs slim-node 2>&1 | grep -q "dataplane server started" && exit 0
            sleep 1
          done
          echo "::error::SLIM node did not start"
          docker logs slim-node
          exit 1

      - name: Integration tests
        env:
          # Fail instead of skipping if the node is unreachable.
          SLIM_A2A_INTEGRATION: required
        run: dotnet test --project tests/SlimA2A.IntegrationTests/SlimA2A.IntegrationTests.csproj -c Release

      - name: SLIM node logs
        if: failure()
        run: docker logs slim-node
