name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)

      - name: Install protoc-gen-slimrpc-csharp
        run: cargo install agntcy-protoc-slimrpc-plugin --version 2.0.0 --locked

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: buf generate
        run: buf generate
        working-directory: src/SlimA2A.Protos

      - name: Verify generated code is up to date
        run: |
          git diff --exit-code -- src/SlimA2A.Protos/Generated \
            || { echo "::error::Generated code is stale. Run 'buf generate' in src/SlimA2A.Protos and commit the result."; exit 1; }

      - name: dotnet build and test
        run: |
          dotnet build SlimA2A.sln -c Release
          dotnet test SlimA2A.sln -c Release --no-build
